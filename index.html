<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RepTrack - Progressive Overload Workout Planner</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
</head>
<body>
  <div class="container">

    <!-- Navbar -->
    <nav class="navbar">
      <ul class="menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="routines.html">Routines</a></li>
        <li class="dropdown">
          <a href="#">Sections ▾</a>
          <ul class="dropdown-menu">
            <li><a href="index.html?section=workout">Workout Form</a></li>
            <li><a href="index.html?section=history">History</a></li>
            <li><a href="index.html?section=chart">Progress Chart</a></li>
            <li><a href="index.html?section=streak">Streak Tracker</a></li>
          </ul>
        </li>
      </ul>
    </nav>

    <header>
      <h1>RepTrack</h1>
      <p>Progressive Overload Workout Planner</p>
    </header>

    <main class="content">
      <!-- Workout Form -->
      <section class="card workout-form" id="workout">
        <h2>Workout Form</h2>
        <form id="workoutForm">
          <label for="exerciseSearch">Exercise</label>
          <input id="exerciseSearch" type="text" placeholder="Start typing an exercise..." autocomplete="off" required>
          <ul id="exerciseResults"></ul>

          <label for="weight">Weight (lbs)</label>
          <input type="number" id="weight" placeholder="150" min="1" required />

          <div class="inline-fields">
            <div class="field">
              <label for="reps">Reps</label>
              <input type="number" id="reps" placeholder="8" min="1" required />
            </div>

            <div class="field">
              <label for="sets">Sets</label>
              <input type="number" id="sets" placeholder="3" min="1" required />
            </div>
          </div>

          <button type="submit">Add Workout</button>
        </form>
      </section>

      <!-- History -->
      <section class="card history" id="history">
        <h2>History</h2>
        <div class="history-list" id="historyList">
          <p id="emptyMessage">No workouts yet. Add one!</p>
        </div>
        <button id="clearHistoryBtn">Clear History</button>
      </section>

      <!-- Chart -->
      <section class="card chart" id="chart">
        <h2>Chart</h2>
        <canvas id="progressChart" width="400" height="200"></canvas>
      </section>

      <!-- Streak -->
      <section class="card streak" id="streak">
        <h2>Streak</h2>
        <div class="streak-display">
          <div class="flame"></div>
          <p><span id="streakCount">0</span>-Day Streak</p>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/main.js"></script>

  <script type="module">
  import { initDropdown } from "./js/dropdown.js";

  // Enable dropdown
  initDropdown();

  // Read URL parameters
  const params = new URLSearchParams(window.location.search);
  const section = params.get("section");

  if (section) {
    const target = document.getElementById(section);
    if (target) {
      setTimeout(() => {
        // Smooth scroll
        target.scrollIntoView({ behavior: "smooth", block: "center" });

        // Jump animation
        target.classList.add("section-jump");

        // Remove class so the animation can re-run later
        setTimeout(() => {
          target.classList.remove("section-jump");
        }, 400);

      }, 300);
    }
  }
</script>

</body>
</html>

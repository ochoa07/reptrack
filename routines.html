<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RepTrack - Exercise Routines</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/routine.css" />
  
</head>
<body>
  <div class="container">

    <!-- Navbar -->
    <nav class="navbar">
      <ul class="menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="planner.html?section=workout">Planner</a></li>
        <li class="dropdown">
          <a href="#">Routines ▾</a>
          <ul class="dropdown-menu">
            <li><a href="routines.html?section=upper">Upper Body</a></li>
            <li><a href="routines.html?section=lower">Lower Body</a></li>
            <li><a href="routines.html?section=cardio">Cardio</a></li>
            <li><a href="routines.html?section=abs">Abs</a></li>
          </ul>
        </li>
      </ul>
    </nav>

    <header>
      <h1>Exercise Routines</h1>
      <p>Choose a routine and follow the recommended workouts</p>
    </header>


    <main class="routine-page">
  <div class="routine-grid">

    <!-- Upper Body -->
    <section class="card routine" id="upper">
      <h2>Upper Body</h2>
      <ul class="routine-list"></ul>
      <button class="generate-btn" data-section="upper">Generate Workout</button>
    </section>

    <!-- Lower Body -->
    <section class="card routine" id="lower">
      <h2>Lower Body</h2>
      <ul class="routine-list"></ul>
      <button class="generate-btn" data-section="lower">Generate Workout</button>
    </section>

    <!-- Cardio -->
    <section class="card routine" id="cardio">
      <h2>Cardio</h2>
      <ul class="routine-list"></ul>
      <button class="generate-btn" data-section="cardio">Generate Workout</button>
    </section>

    <!-- Abs -->
    <section class="card routine" id="abs">
      <h2>Abs</h2>
      <ul class="routine-list"></ul>
      <button class="generate-btn" data-section="abs">Generate Workout</button>
    </section>

  </div>
</main>
</div>

<script type="module" src="js/config.js"></script>
<script type="module" src="js/api.js"></script>
<script type="module" src="js/routines.js"></script>

<script type="module">
  import { initDropdown } from "./js/dropdown.js";

  // Enable dropdown
  initDropdown();

  // Read URL parameters
  const params = new URLSearchParams(window.location.search);
  const section = params.get("section") || params.get("routine");

  if (section) {
    const target = document.getElementById(section);
    if (target) {
      setTimeout(() => {
        // Smooth scroll
        target.scrollIntoView({ behavior: "smooth", block: "center" });

        // Jump animation
        target.classList.add("section-jump");

        // Remove class after animation
        setTimeout(() => {
          target.classList.remove("section-jump");
        }, 400);

        // Auto-generate workout (since routines.js listens for click)
        const button = target.querySelector(".generate-btn");
        if (button) {
          button.click();
        }

      }, 300);
    }
  }
</script>
</body>
</html>
